# Local registry for the starter e2e: anyone may read and publish @orthograph/*, everything else is proxied to npmjs.
# starter.sh fills in __STORAGE__ and __PORT__ and runs the pinned `verdaccio` package under Node (K10 section 8: no container).
storage: __STORAGE__
listen: 127.0.0.1:__PORT__
web: { enable: false }
auth:
  htpasswd:
    file: __STORAGE__/htpasswd
    max_users: 10
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    # An install asks for ~1000 packages at once; the defaults (30s, offline after 2 failures for 5m) turn one slow
    # answer into 404s for everything not yet cached.
    timeout: 120s
    max_fails: 100
    fail_timeout: 2s
    agent_options:
      keepAlive: true
      maxSockets: 32
packages:
  # The front door is the plain package orthograph (K6); every other package is @orthograph/*.
  'orthograph':
    access: $all
    publish: $all
    unpublish: $all
  '@orthograph/*':
    access: $all
    publish: $all
    unpublish: $all
  '**':
    access: $all
    proxy: npmjs
log: { type: stdout, format: pretty, level: warn }
