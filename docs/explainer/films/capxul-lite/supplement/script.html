<script>
(() => {
  // ---- paint the code blocks -------------------------------------------------------------------------------------
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const span = (c, t) => (c ? `<span class="${c}">${esc(t)}</span>` : esc(t));
  const KW = new Set("import export from const let var function return if else class extends new default type as for await of abstract contract is error event external private internal override returns storage bool emit revert".split(" "));
  function ts(line) {
    let out = "", i = 0;
    while (i < line.length) {
      const rest = line.slice(i); let m;
      if (rest.startsWith("//")) { out += span("c", rest); break; }
      if ((m = /^("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)/.exec(rest))) { out += span("s", m[0]); i += m[0].length; continue; }
      if ((m = /^\d[\d_.]*n?/.exec(rest))) { out += span("n", m[0]); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_$][\w$]*/.exec(rest))) { const w = m[0], after = rest.slice(w.length); out += span(KW.has(w) ? "k" : /^\s*\(/.test(after) ? "f" : /^[A-Z]/.test(w) ? "t" : "", w); i += w.length; continue; }
      out += /[{}()[\];,.<>=:/|&?!+-]/.test(rest[0]) ? span("x", rest[0]) : esc(rest[0]); i++;
    }
    return out;
  }
  const mark = (html) => html.replace(/✘/g, '<span style="color:var(--red)">✘</span>').replace(/✔/g, '<span style="color:var(--green)">✔</span>');
  document.querySelectorAll("pre.code").forEach((pre) => {
    const plain = pre.dataset.lang === "text";
    pre.innerHTML = pre.textContent.replace(/\n$/, "").split("\n").map((raw) => {
      const m = plain ? null : /^(.*?)\s*\/\/ new(?::\s*(.*))?$/.exec(raw), line = m ? m[1] + (m[2] ? "  // " + m[2] : "") : raw;
      return `<span class="ln${m ? " isnew" : ""}">${(plain ? mark(esc(line)) : ts(line)) || " "}</span>`;
    }).join("");
  });

  // ---- the simulation: everything below follows these tables -----------------------------------------------------
  const moves = { spend: { from: ["active"], by: ["holder"] }, revoke: { from: ["active", "exhausted"], by: ["owner"] }, renew: { from: ["active", "exhausted"], by: ["time"] } };
  const people = [["ada", "Ada, who holds the budget", "holder"], ["bob", "Bob, an owner", "owner"], ["carol", "Carol, an owner", "owner"], ["other", "Someone else", "other"]];
  const roleOf = Object.fromEntries(people.map(([id, , role]) => [id, role])), nameOf = { ada: "Ada", bob: "Bob", carol: "Carol", other: "Someone else" };
  const movesFor = (state, role) => Object.keys(moves).filter((m) => moves[m].from.includes(state) && moves[m].by.includes(role));
  const THRESHOLD = 2, OWNERS = 3, stages = ["tried", "signed", "submitted", "confirmed"];
  const $ = (id) => document.getElementById(id), money = (v) => v.toLocaleString("en-GB") + " USDC", later = (ms, f) => setTimeout(() => { f(); draw(); }, ms);
  // A stand-in for the seal: a short hash of a salt and the reason. The real one would be a proper salted hash.
  const seal = (reason, salt) => { let h = 2166136261; for (const ch of salt + "|" + reason) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return "0x" + (h >>> 0).toString(16).padStart(8, "0") + "…"; };

  const budget = { state: "active", limit: 1000, spent: 0 }, journal = [], spends = [], kept = new Map(), signed = new Map();
  let who = "ada", call = null, n = 0, salt = 0, proposal = null, pn = 0, granted = 0, form = { amount: 400, reason: "Design work, March" };
  const log = (cls, text, where) => journal.unshift(`<li><span class="${cls}">${esc(text)}</span> <span class="who">${esc(where)}</span></li>`);

  function start() {
    const amount = Math.max(1, Math.round(+form.amount || 0)), reason = String(form.reason || "").trim() || "No reason given";
    call = { amount, reason, at: null };
    if (budget.spent + amount > budget.limit) { call.at = "refused"; call.why = "BudgetExceeded: the contract would refuse this. Nothing was signed and nothing was sent."; log("no", "✘ tried: BudgetExceeded", "the chain, asked for free"); return; }
    call.at = "tried"; log("sys", "tried: would pass", "the chain, asked for free");
  }
  function sign() {
    const c = call; c.seal = seal(c.reason, "s" + ++salt); signed.set(c.seal, c.reason); c.at = "signed";
    log("sys", `signed once: ${money(c.amount)}, and the seal ${c.seal}`, "Ada's wallet");
    later(700, () => { kept.set(c.seal, c.reason); c.at = "submitted"; log("sys", "the reason is kept under its seal, and the call is sent", "our server, the relayer"); land(c.amount, c.seal, c, "the chain"); });
  }
  // The chain's half, the same whoever sent the call: the machine, the rule, the payment, the event. Then the indexer hands it on.
  function land(amount, sealed, c, where) {
    later(900, () => {
      if (budget.state !== "active" || budget.spent + amount > budget.limit) {
        const why = budget.state !== "active" ? "BudgetNotActive" : "BudgetExceeded"; log("no", `✘ reverted: ${why}`, where);
        if (c) { c.at = "reverted"; c.why = `${why}: the contract refused it. No money moved, and the reason we kept is never used.`; } return;
      }
      budget.spent += amount; if (budget.spent >= budget.limit) budget.state = "exhausted";
      log("ev", `BudgetSpent ${money(amount)} · seal ${sealed}`, where);
      later(1300, () => {
        const reason = kept.get(sealed), id = "spd_" + ++n;
        spends.unshift({ id, amount, seal: sealed, reason, state: reason ? "paid" : "unexplained" });
        if (c) c.at = "confirmed";
        log("ev", `SpendRecorded ${id}: ${reason ? "paid" : "unexplained"}`, "our server, from the indexer");
        if (!reason) log("no", "no contents for that seal", "our server"); log("sys", "entry written", "the books, same commit");
      });
    });
  }
  const act = {
    start, sign,
    reject() { call.at = "rejected"; call.why = "Ada said no in her wallet. Nothing was sent, here or to the chain."; log("sys", "rejected", "Ada's wallet"); },
    around() { const sealed = seal("Team lunch", "s" + ++salt); signed.set(sealed, "Team lunch"); log("sys", `a call straight to the contract: ${money(150)}, seal ${sealed}`, "Ada's wallet, not our app"); land(150, sealed, null, "the chain, straight from her wallet"); },
    revoke() { budget.state = "revoked"; log("ev", "BudgetRevoked", `the chain, signed by ${nameOf[who]}`); },
    renew() { budget.spent = 0; budget.state = "active"; log("ev", "BudgetRenewed", "the chain, by time"); },
    explain(id) { const sp = spends.find((x) => x.id === id); sp.reason = signed.get(sp.seal); sp.state = "paid"; sp.note = ""; kept.set(sp.seal, sp.reason); log("ev", `SpendExplained ${id}`, "our server, by Ada"); log("sys", "the reason matches the seal", "our server"); },
    wrong(id) { const sp = spends.find((x) => x.id === id); sp.note = "SealMismatch: that reason does not match what was signed."; log("no", `✘ explain ${id}: it does not match the seal`, "our server"); },
    propose() { proposal = { id: "pro_" + ++pn, state: "open", approvals: [] }; log("ev", `ProposalOpened ${proposal.id}`, `the chain, signed by ${nameOf[who]}`); log("sys", `it needs ${THRESHOLD} of ${OWNERS} owners: each of them is told`, "our server, from the machine"); },
    approve() {
      proposal.approvals.push(who); log("ev", `ProposalApproved ${proposal.id} by ${nameOf[who]}`, "the chain");
      if (proposal.approvals.length >= THRESHOLD) { proposal.state = "passed"; granted++; log("ev", `ProposalPassed ${proposal.id}`, "the chain, same transaction"); log("ev", `BudgetGranted: ${money(500)} a month for the agent`, "the chain, same transaction"); }
    },
    week() { proposal.state = "expired"; log("ev", `ProposalExpired ${proposal.id}`, "the chain, by time"); },
  };

  function draw() {
    const role = roleOf[who], can = movesFor(budget.state, role), pct = (v) => Math.min(100, 100 * v / budget.limit).toFixed(1) + "%", busy = call && ["tried", "signed", "submitted"].includes(call.at);
    $("who").innerHTML = people.map(([id, name]) => `<button type="button" data-who="${id}" aria-pressed="${id === who}">${name}</button>`).join("");
    $("budget").innerHTML = `<span class="state${budget.state === "revoked" ? " bad" : ""}">${budget.state}</span>
      <div class="meter" style="margin-top:12px" role="img" aria-label="Spent ${money(budget.spent)} of ${money(budget.limit)}"><i style="width:${pct(budget.spent)}"></i></div>
      <div class="kv">limit <b>${money(budget.limit)}</b> a month<br>spent <b>${money(budget.spent)}</b><br>left <b>${money(budget.limit - budget.spent)}</b><br>can <b>${JSON.stringify(can)}</b></div>
      <div class="moves">${can.includes("revoke") ? `<button type="button" class="soft" data-act="revoke">Revoke</button>` : ""}${movesFor(budget.state, "time").length ? `<button type="button" class="soft" data-act="renew">A month passes</button>` : ""}${can.includes("spend") ? `<button type="button" class="soft" data-act="around">Pay around the app</button>` : ""}</div>
      ${granted ? `<div class="kv">and <b>${granted}</b> more budget${granted > 1 ? "s" : ""}, granted by a proposal: <b>${money(500)}</b> a month for the agent</div>` : ""}`;

    const strip = call ? `<div class="steps">${stages.map((s) => `<span class="${stages.indexOf(call.at) >= stages.indexOf(s) ? "on" : ""}">${s}</span>`).join("")}${["refused", "rejected", "reverted"].includes(call.at) ? `<span class="bad">${call.at}</span>` : ""}</div>` : "";
    const entry = can.includes("spend") && !busy ? `<div class="moves"><label for="amount">Amount</label><input id="amount" type="number" min="1" step="50" value="${esc(String(form.amount))}"></div>
      <div class="moves"><label for="reason">Reason</label><input id="reason" type="text" style="width:190px" value="${esc(String(form.reason))}"><button type="button" data-act="start">Spend</button></div>`
      : !busy ? `<p class="nomove">${role === "holder" ? "No spend is open to you while the budget is " + budget.state + "." : "Spending is not open to you. You don't hold this budget."}</p>` : "";
    const wallet = call && call.at === "tried" ? (role === "holder" ? `<div class="wallet"><b>Ada's wallet asks</b>Pay someone from the treasury, out of this budget.<br>${money(call.amount)} to 0x51…c2, and the seal of your reason.<div class="moves"><button type="button" data-act="sign">Sign once</button><button type="button" class="soft" data-act="reject">Reject</button></div></div>` : `<p class="nomove">Waiting for Ada's wallet.</p>`) : "";
    $("spend").innerHTML = `${call ? `<div class="kv" style="margin-top:0"><b>${money(call.amount)}</b> · ${who === "other" ? "the reason is hidden from you" : "“" + esc(call.reason) + "”"}</div>` : ""}${strip}${wallet}${call && call.why ? `<div class="refusal">${esc(call.why)}</div>` : ""}${entry}`;

    $("books").innerHTML = spends.length ? `<ul class="books">${spends.map((sp) => `<li><div class="row"><b>${sp.id}</b><span>${money(sp.amount)}</span><span class="pill${sp.state === "paid" ? "" : " sys"}">${sp.state}</span></div>
      <div class="why">${sp.reason ? (who === "other" ? "The reason is private. You can't see it." : "“" + esc(sp.reason) + "”") : "No reason. The chain carries the seal " + sp.seal + ", and we hold nothing for it."}</div>
      ${sp.state === "unexplained" && role === "holder" ? `<div class="moves"><button type="button" data-act="explain" data-id="${sp.id}">Explain, with what she signed</button><button type="button" class="soft" data-act="wrong" data-id="${sp.id}">Explain, with something else</button></div>` : ""}${sp.note ? `<div class="refusal">${esc(sp.note)}</div>` : ""}</li>`).join("")}</ul>` : `<p class="nomove">No payments yet. Spend as Ada.</p>`;

    const p = proposal, owner = role === "owner", open = p && p.state === "open", mayApprove = open && owner && !p.approvals.includes(who), left = p ? THRESHOLD - p.approvals.length : 0;
    $("proposal").innerHTML = !p ? `<p class="nomove">No proposal is open.</p>` : `<span class="state${p.state === "passed" ? " good" : p.state === "expired" ? " bad" : ""}">${p.state}</span>
      <div class="kv"><b>${p.id}</b> · a budget of <b>${money(500)}</b> a month, for the agent<br>approved by <b>${p.approvals.map((a) => nameOf[a]).join(", ") || "nobody yet"}</b>${open ? `<br>can <b>${JSON.stringify(mayApprove ? ["approve"] : [])}</b>` : ""}</div>
      ${open ? `<div class="needs">It needs ${left} more owner${left > 1 ? "s" : ""}, within 7 days.${mayApprove ? " It is waiting on you." : ""}</div>` : p.state === "passed" ? `<div class="kv">The budget was granted in the same transaction. Nobody called the grant.</div>` : `<div class="kv">Nobody answered in time. A clock closed it.</div>`}`;
    $("proposal").innerHTML += `<div class="moves" style="margin-top:10px">${mayApprove ? `<button type="button" data-act="approve">Approve</button>` : ""}${open ? `<button type="button" class="soft" data-act="week">Seven days pass</button>` : owner ? `<button type="button" data-act="propose">Propose a budget for the agent</button>` : `<span class="nomove">Only an owner can propose.</span>`}</div>`;
    $("journal").innerHTML = journal.join("") || `<li class="who">Nothing yet. Spend as Ada, or propose as Bob.</li>`;
  }
  $("sim").addEventListener("click", (e) => {
    const w = e.target.closest("[data-who]"), a = e.target.closest("[data-act]");
    if (w) who = w.dataset.who; else if (a) act[a.dataset.act](a.dataset.id); else return;
    draw();
  });
  $("sim").addEventListener("input", (e) => { if (e.target.id === "amount" || e.target.id === "reason") form[e.target.id] = e.target.value; });

  const cols = [["holder", "Ada, who holds it"], ["owner", "An owner"], ["other", "Someone else"], ["time", "Time"]];
  $("matrix").innerHTML = `<tr><th>The budget is</th>${cols.map(([, name]) => `<th>${name}</th>`).join("")}</tr>` + ["active", "exhausted", "revoked"].map((s) =>
    `<tr><td class="mono">${s}</td>${cols.map(([id]) => { const ms = movesFor(s, id); return `<td>${ms.length ? ms.map((m) => `<span class="pill${id === "time" ? " sys" : ""}">${m}</span>`).join("") : '<span class="pill none">nothing</span>'}</td>`; }).join("")}</tr>`).join("");
  draw();
})();
</script>
<script>
// Captions for the two films: a WebVTT file, published as plain text, turned into a caption track the viewer can switch on.
(() => {
  const seconds = (stamp) => stamp.split(":").reduce((sum, part) => sum * 60 + parseFloat(part), 0);
  document.querySelectorAll("video[data-captions]").forEach((video) => {
    fetch(video.dataset.captions).then((r) => (r.ok ? r.text() : "")).then((text) => {
      const cues = [...text.matchAll(/(\d\d:\d\d:\d\d\.\d\d\d) --> (\d\d:\d\d:\d\d\.\d\d\d)\n([^\n]+)/g)];
      if (!cues.length) return;
      const track = video.addTextTrack("captions", "English", "en");
      cues.forEach(([, from, to, words]) => track.addCue(new VTTCue(seconds(from), seconds(to), words)));
    }).catch(() => {});
  });
})();
</script>
