name: staging

# M7.04, the CI-only check of Goal 3 (design/goals/03-stage-1-hill-climbed.md, "Staging"; design/decisions/M7-cloud.md and its addenda). One job (plus `refuse`, which fails a dispatch off a goal branch out loud), started by hand, and
# nothing else starts it: no push, no pull request, no schedule. It plans, deploys Plugged In to Cloudflare `workers.dev`, runs the story, destroys what it made, and lists the
# account. The job is red when any of these holds: the plan is wrong; up fails; the story fails; a resource with this run's prefix is left; a resource without it changed.
#
# Written by the checks author (✍️); a builder never edits this file (tools/ci/builder-paths.sh). The builder makes `ortho env up staging` and `ortho env destroy staging` real
# (check 37 pins their `--plan`); this workflow only calls them. e2e/staging/README.md says what each step judges. The lead decides when the first real run happens.
#
# The credentials are only `secrets.CLOUDFLARE_API_TOKEN` and `vars.CLOUDFLARE_ACCOUNT_ID`, and each is in the `env` of the steps that talk to Cloudflare (the snapshots, the subdomain read, up, the story and
# destroy) and nowhere else. Nothing here prints or writes either. The evidence uploaded is the plan, the story, the verdict and the listings cut to the run's prefix: never a credential, never wrangler's own log, and never a name that
# is not the run's (the repository is public, and the account holds other apps' resources).
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: the "nothing without the prefix changed" judgement compares the account before and after, so another run (which changes the account with its own prefix) is not to
# overlap. Never cancelled midway: a cancelled run is one that did not destroy.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  # A dispatch on any ref that is not a goal branch is refused out loud: a skipped job would show nothing. `main` has no `ortho env` yet, and a run there would fail halfway with live
  # credentials in play. This file is the same on `main` and on the goal branches, so the guard lives here. No credential, no checkout: it only says why.
  refuse:
    if: "!startsWith(github.ref, 'refs/heads/goal/')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refuse
        run: |
          echo "::error::staging runs only from a goal branch (refs/heads/goal/...); this dispatch is on $REF"
          exit 1
        env:
          REF: ${{ github.ref }}

  staging:
    if: startsWith(github.ref, 'refs/heads/goal/')
    runs-on: ubuntu-latest
    # A protected environment: its branch rule (protected branches only) is set on GitHub by Aaron or the lead; this file only names it.
    environment: staging
    timeout-minutes: 30
    env:
      # The run id is the run's name: `ortho env up staging --plan` makes the prefix from it, and everything below reads the prefix from that plan, never forming it again.
      RUN: ${{ github.run_id }}${{ github.run_attempt }}
      ORTHO: node packages/cli/src/main.ts
      EVIDENCE: tmp/staging
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The plan first: no credential, no network. It is what the run is judged against.
      - name: plan
        id: plan
        run: |
          mkdir -p "$EVIDENCE/private"
          $ORTHO env up staging --plan --run "$RUN" --root examples/plugged-in > "$EVIDENCE/plan.json"
          echo "prefix=$(jq -r .prefix "$EVIDENCE/plan.json")" >> "$GITHUB_OUTPUT"

      # What the account holds before anything is made: the baseline for "nothing without the prefix changed". If it cannot be read, nothing is made.
      - name: snapshot before
        id: before
        run: node e2e/staging/leftovers.mjs snapshot "$EVIDENCE/private/before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: up
        id: up
        continue-on-error: true
        run: $ORTHO env up staging --run "$RUN" --root examples/plugged-in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # While it is up: what the run's prefix holds is what the plan said (judged at the end, with the plan).
      - name: snapshot while up
        id: during
        if: steps.up.outcome == 'success'
        run: node e2e/staging/leftovers.mjs snapshot "$EVIDENCE/private/during.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The account's workers.dev subdomain, read with the token and handed to the story as an output (a subdomain is not a secret). Only `subdomain=<name>` is written; the response is never printed.
      - name: subdomain
        id: subdomain
        if: steps.up.outcome == 'success'
        run: node e2e/staging/subdomain.mjs "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The story, through the same `prove` the other environments use, against the deployed address. It holds the same two credentials as up, to read the run's own D1 databases. Whether it passes never decides
      # whether destroy runs.
      - name: the story
        id: story
        continue-on-error: true
        if: steps.up.outcome == 'success'
        # The account's workers.dev subdomain, from the step above (not a secret). The address is
        # <prefix>-worker.<subdomain>.workers.dev, formed by prove from the same prefix `up` used (check 41). The story reads the run's own D1 databases with the operator's credential
        # (M7-04-story-reads-d1): the token and the account are the same expressions `up` uses, and the databases are found by the run's prefix.
        env:
          ORTHO_STAGING_SUBDOMAIN: ${{ steps.subdomain.outputs.subdomain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: $ORTHO prove --env staging --run "$RUN" --root examples/plugged-in --only "a person claims a page and shares it" 2>&1 | tee "$EVIDENCE/story.txt"; exit "${PIPESTATUS[0]}"

      # Destroy always runs: after a failed up, a failed story, a failed before-snapshot, or a plan that never printed. It deletes by the run's prefix, so it needs nothing from `up`.
      - name: destroy
        id: destroy
        if: always()
        run: $ORTHO env destroy staging --run "$RUN" --root examples/plugged-in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The listing after destroy: Workers, D1 databases, Durable Object namespaces and R2 buckets, whole.
      - name: snapshot after destroy
        id: after
        if: always()
        run: node e2e/staging/leftovers.mjs snapshot "$EVIDENCE/private/after.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # The verdict, from files only. Fails when any resource with the run's prefix remains, when any resource without it was removed or appeared, and (when up succeeded) when
      # up made anything but what the plan said.
      - name: nothing left, nothing else changed
        id: judge
        if: always()
        run: |
          args=(--prefix "$PREFIX" --after "$EVIDENCE/private/after.json" --before "$EVIDENCE/private/before.json")
          if [ "$UP" = success ]; then args+=(--during "$EVIDENCE/private/during.json" --plan "$EVIDENCE/plan.json"); fi
          node e2e/staging/leftovers.mjs judge "${args[@]}" 2>&1 | tee "$EVIDENCE/verdict.txt"; exit "${PIPESTATUS[0]}"
        env:
          PREFIX: ${{ steps.plan.outputs.prefix }}
          UP: ${{ steps.up.outcome }}

      # The run's own part of the listings, for the evidence. The whole-account listings stay in tmp/staging/private and are never uploaded: the repository is public and the account
      # holds other apps' resources.
      - name: the run's own listings
        id: evidence
        if: always()
        run: node e2e/staging/leftovers.mjs filter "$PREFIX" "$EVIDENCE/private" "$EVIDENCE"
        env:
          PREFIX: ${{ steps.plan.outputs.prefix }}

      # up and the story were allowed to fail so that destroy and the listing could run; they still fail the job.
      - name: up and the story must have passed
        if: always() && (steps.up.outcome == 'failure' || steps.story.outcome == 'failure')
        run: |
          echo "::error::up was $UP and the story was $STORY; destroy ran and the listing above says what is left."
          exit 1
        env:
          UP: ${{ steps.up.outcome }}
          STORY: ${{ steps.story.outcome }}

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: staging-evidence-${{ github.run_id }}
          path: |
            tmp/staging/plan.json
            tmp/staging/story.txt
            tmp/staging/verdict.txt
            tmp/staging/during-run.json
            tmp/staging/after-run.json
          if-no-files-found: warn
          retention-days: 7
