name: ci

on:
  push:
    # A goal branch other than goal/stage-1 has no push run: its landing pull request tests the result (CI-integration.md, B2).
    branches: [main, "layer/**", "m[0-9]", goal/stage-1]
  # ready_for_review: a draft runs nothing (every job below starts with the draft guard), and marking it ready runs CI
  # once (design/decisions/CI-drafts.md).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes, so the queue holds only live work.
# Every push to main, a milestone branch or goal/stage-1 gets its own group, so none is cancelled or dropped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a timeout, about twice its longest green run, so a hung run or one left behind by a closed pull request
# frees its runner instead of holding it for hours.
jobs:
  # `check` (required) is every project's lint, typecheck and tests, the sync check and the CI scripts' own tests. It runs
  # as three jobs side by side (design/decisions/CI-speed.md): prove's tests alone took 13 of check's 16 minutes, so they
  # run in shards, and the rest runs beside them. The small `check` job at the end passes only when both did.
  check-static:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # A world's chain is Anvil as a plain process (K10 section 8: no container, no Docker step). Foundry is pinned
      # to an exact version, and the tests that start Anvil run here (M1.31).
      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
      - run: anvil --version
      # Every target of every project except prove's tests, which prove-tests runs.
      - run: pnpm nx run-many -t lint,typecheck,test --exclude=prove --outputStyle=static
        env:
          ORTHO_CHAIN_EVM_ANVIL: "1"
      - run: pnpm nx run-many -t lint,typecheck -p prove --outputStyle=static
      # Nx 24 skips task-level sync generators in CI, so drift is checked explicitly.
      - run: pnpm nx sync:check
      # The CI guards' own scripts (builder-paths, supersedes, codex-state, gate, m1-reports), each case on a throwaway repository.
      - run: bash tools/ci/ci.test.sh

  # prove's tests, split by file into three shards (vitest's --shard), each on its own runner with the same steps as
  # check-static. Every shard runs to the end (no fail-fast), so one run shows every failure. Skipped on a docs-only pull
  # request, like the layer gates: no prove test reads design/ or a doc outside packages/ (CI-speed.md).
  prove-tests:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true')) }}
    name: prove-tests (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # A world's chain is Anvil as a plain process (K10 section 8: no container, no Docker step). Foundry is pinned
      # to an exact version, and the tests that start Anvil run here (M1.31).
      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
      - run: anvil --version
      - run: pnpm nx run prove:test --outputStyle=static -- --shard=${{ matrix.shard }}/3
        env:
          ORTHO_CHAIN_EVM_ANVIL: "1"

  # The required check's name. It never skips (a skipped required check counts as passed): it runs whatever its needs
  # did, and tools/ci/gate.sh fails it unless check-static passed and every prove-tests shard passed, or the shards were
  # skipped by the docs fast path.
  check:
    needs: [changes, check-static, prove-tests]
    if: ${{ github.event.pull_request.draft != true && (!cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools/ci
      - run: tools/ci/gate.sh "check-static=$STATIC" "docs:prove-tests=$PROVE"
        env:
          DOCS_ONLY: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
          STATIC: ${{ needs.check-static.result }}
          PROVE: ${{ needs.prove-tests.result }}

  # A builder never edits journeys, evals or the runner's checks (AGENTS.md; proposal 6 in design/process/proposals.md).
  # Builders' branches end in `-build`; on their pull requests this fails on any such file (tools/ci/builder-paths.sh).
  # Any other pull request or push skips it, and a skipped job counts as passed where it is required.
  builder-paths:
    if: github.event.pull_request.draft != true && (github.event_name == 'pull_request' && endsWith(github.head_ref, '-build'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: tools/ci/builder-paths.sh "origin/$BASE_REF" HEAD
        env:
          BASE_REF: ${{ github.base_ref }}

  # M1.34 (F7): `@orthograph/portal-ui` is built and typechecked against the real HeroUI Pro, which only a licensed install has.
  # Pro is downloaded with the HEROUI_AUTH_TOKEN secret (Aaron's, from the HeroUI Pro dashboard) and cached by the lockfile's
  # hash, because HeroUI caps CI downloads per token per day. The secret is read in one step's `env`, never at workflow level and
  # never inside a script; the job never runs for a pull request from a fork, so the secret never reaches code we did not write.
  # Every other job installs the registry's empty shell of Pro and runs without it (portal-ui's typecheck says it was skipped).
  portal-ui:
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # A pull request into a goal branch runs the fast gate only (CI-integration.md, B1): this job passes without its steps.
      # It reads the flag itself rather than needing `changes`, so it also runs when `changes` fails.
      - id: scope
        run: tools/ci/scope.sh "$EVENT" "$BASE_REF" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
      - uses: pnpm/action-setup@v6.1.0
        if: steps.scope.outputs.fast != 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.fast != 'true'
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6.1.0
        if: steps.scope.outputs.fast != 'true'
        id: pro-cache
        with:
          path: .cache/heroui-pro
          key: heroui-pro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.fast != 'true'
      - name: Restore Pro from the cache
        if: steps.pro-cache.outputs.cache-hit == 'true' && steps.scope.outputs.fast != 'true'
        run: node packages/portal-ui/tools/pro.mjs @heroui-pro/react restore .cache/heroui-pro
      - name: Install Pro with the licence token
        if: steps.pro-cache.outputs.cache-hit != 'true' && steps.scope.outputs.fast != 'true'
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: node packages/portal-ui/tools/pro.mjs @heroui-pro/react fetch
      - name: Keep Pro for the cache
        if: steps.pro-cache.outputs.cache-hit != 'true' && steps.scope.outputs.fast != 'true'
        run: node packages/portal-ui/tools/pro.mjs @heroui-pro/react save .cache/heroui-pro
      - name: Lint, typecheck, test and build portal-ui against the real Pro
        if: steps.scope.outputs.fast != 'true'
        run: pnpm nx run-many -t lint,typecheck,test,build -p portal-ui --outputStyle=static
        env:
          ORTHO_REQUIRE_PRO: "1"
      # K19: the portal's client (its pages, portal-ui and Pro, bundled by vite) is built here, once, where the licence is, and handed to the
      # jobs that read the portal as built files. Nothing else builds it, so nothing else needs the licence.
      - name: Build the portal's client against the real Pro
        if: steps.scope.outputs.fast != 'true'
        run: pnpm nx run portal:client --outputStyle=static
        env:
          ORTHO_REQUIRE_PRO: "1"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.scope.outputs.fast != 'true'
        with:
          name: portal-client
          path: packages/portal/dist/client
          if-no-files-found: error
          retention-days: 7
      - name: List what npm would publish
        if: steps.scope.outputs.fast != 'true'
        run: npm pack --dry-run --ignore-scripts
        working-directory: packages/portal-ui
      # Check 15 (the seam): the packed files hold nothing of Pro, and no import of Pro lives outside portal-ui.
      - run: pnpm exec vitest run --root e2e --config vitest.m1.config.ts m1/15
        if: steps.scope.outputs.fast != 'true'

  # Is this pull request docs only? Then the layer gates, prove-tests, the M1 shards, e2e-climb and e2e-grid skip
  # (design/decisions/CI-docs-fast-path.md, CI-speed.md): main is strict, so every pull request reruns all of CI each time
  # another lands, and a docs change cannot move them. Docs-only is every changed path under design/, or a *.md file
  # outside packages/, e2e/ and examples/ (tools/ci/docs-only.sh). A push, or a pull request with any other change, runs
  # everything. check-static, `e2e-m0` and portal-ui always run, since they lint the docs, build the
  # design docs and run the supersedes guard.
  # Never workflow-level `paths-ignore`: a workflow that never starts leaves its required checks pending forever.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      fast: ${{ steps.diff.outputs.fast }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            tools/ci/docs-only.sh "origin/$BASE_REF" HEAD >> "$GITHUB_OUTPUT"
          else
            echo docs_only=false >> "$GITHUB_OUTPUT"
          fi
          # A pull request into a goal branch other than goal/stage-1 runs the fast gate only (CI-integration.md, B1).
          tools/ci/scope.sh "$EVENT" "$BASE_REF" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

  # Gate 1 (L1.60): the seven checks of layer one, run as a user runs Orthograph (D2 #74).
  e2e-layer1:
    # Skipped on a docs-only pull request, where a skip counts as passed. Should `changes` itself fail, this runs.
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # Check 4 runs its agent when this secret exists, and says why it skipped when it doesn't (D2 #41).
      # The key is given only to pull requests into main and pushes to main, so layer-branch pushes spend nothing
      # (each run is capped at $5, and the cap across everything is $10 a day; D3 #71).
      - run: pnpm nx run e2e:layer1 --outputStyle=static
        env:
          ANTHROPIC_API_KEY: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && secrets.ANTHROPIC_API_KEY || '' }}

  # Gate 2 (L2.11): all eight authored shipping checks, including the Linux Homebrew install.
  e2e-layer2:
    # Skipped on a docs-only pull request, where a skip counts as passed. Should `changes` itself fail, this runs.
    # Not skipped when portal-ui is: a skipped job reads as passed where it is required, and this one cannot pass without the client. It runs, and fails at the artifact.
    needs: [changes, portal-ui]
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # K19: the portal's built client, from the portal-ui job (the only one with the licence).
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portal-client
          path: packages/portal/dist/client
      - name: The portal's client must be here
        run: |
          if [ ! -f packages/portal/dist/client/index.html ]; then
            echo "::error::K19: the portal's client is missing. The portal-ui job builds it with the licence; this job reads the portal and cannot pass without it."
            exit 1
          fi
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - name: Require Homebrew for Gate 2
        shell: bash
        run: |
          brew_bin=/home/linuxbrew/.linuxbrew/bin
          if [[ ! -x "$brew_bin/brew" ]]; then
            echo "::error::Gate 2 requires the runner's preinstalled Homebrew; the install check must run."
            exit 1
          fi
          echo "$brew_bin" >> "$GITHUB_PATH"
          "$brew_bin/brew" --version
      - run: NX_DAEMON=false pnpm nx run e2e:layer2 --outputStyle=static

  # M8's checks (e2e/m8/README.md), written before time is built: the ratchet passes while every failure is listed in
  # e2e/m8/expected-failing/, and fails on any other. Skipped on a docs-only pull request, like the gates above.
  e2e-m8:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: NX_DAEMON=false pnpm nx run e2e:m8-ratchet --outputStyle=static

  # Gate M0 (M0.06): no old name outside the records, and the design docs build with every link resolving.
  # The canon's check (docs/canon/README.md) runs beside it: every quote, reference and component in the MDX pages.
  # Gates 1 and 2 above are the rest of `nx run e2e:m0`, run as their own jobs so they run side by side.
  e2e-m0:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.fast == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run e2e:m0-names --outputStyle=static
      - run: pnpm nx run docs:check --outputStyle=static
      - run: pnpm nx run canon:check --outputStyle=static
      # A decision's `## Supersedes` phrases are gone from everything but the records (proposal 8; AGENTS.md, "Who decides").
      - run: tools/ci/supersedes.sh

  # M1's checks also run together in CI, through the ratchet (e2e/ratchet/README.md): the checks whose slice has not landed
  # are on the per-check files of e2e/m1/expected-failing/ (G9) and may fail; any other failure fails the job, so a regression cannot merge unseen.
  # They run as four shards (design/decisions/CI-speed.md): each runs a quarter of the files, still one file at a time on its
  # own runner, with the vitest command of `nx run e2e:m1-ratchet` plus `--shard`, and hands on its JSON report and hook-error
  # file. A shard passes when it wrote both, whatever its tests did; the `e2e-m1` job below judges them all together.
  # Skipped on a docs-only pull request: no M1 check reads design/ or a doc outside packages/, e2e/ and examples/.
  e2e-m1-shard:
    needs: [changes, portal-ui]
    # Not skipped when portal-ui is: a skipped job reads as passed where it is required, and this one cannot pass without the client. It runs, and fails at the artifact.
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    name: e2e-m1-shard (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # K19: the portal's built client, from the portal-ui job (the only one with the licence).
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portal-client
          path: packages/portal/dist/client
      - name: The portal's client must be here
        run: |
          if [ ! -f packages/portal/dist/client/index.html ]; then
            echo "::error::K19: the portal's client is missing. The portal-ui job builds it with the licence; this job reads the portal and cannot pass without it."
            exit 1
          fi
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # Check 09's send journeys run on Anvil, a plain process, the same pinned Foundry as the check job (M1.31).
      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
      # K19: the portal is read in headless Chromium (e2e/served-portal). Playwright's own download plus the system libraries it needs on this image.
      - run: pnpm --filter @orthograph/e2e exec playwright install --with-deps chromium
      # The vitest command of `nx run e2e:m1-ratchet` (e2e/project.json), with --shard. Its exit is not the verdict (listed
      # checks fail here by design); the report and the hook-error file are, so both must exist.
      - name: Run this shard's M1 checks
        run: |
          mkdir -p tmp && rm -f tmp/m1-report.json tmp/m1-errors.json
          code=0
          RATCHET_ERRORS_FILE=tmp/m1-errors.json pnpm exec vitest run --root e2e --config vitest.m1-ratchet.config.ts m1 \
            --shard="$SHARD/4" --reporter=default --reporter=json --reporter=./e2e/ratchet/reporter.ts \
            --outputFile.json=../tmp/m1-report.json || code=$?
          echo "vitest exited $code; the e2e-m1 job judges the report."
          for file in tmp/m1-report.json tmp/m1-errors.json; do
            [ -s "$file" ] || { echo "::error::$file is missing: this shard's run did not finish."; exit 1; }
          done
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: m1-report-${{ matrix.shard }}
          path: |
            tmp/m1-report.json
            tmp/m1-errors.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # The required check's name: the ratchet over all four shards' reports at once. It never skips (a skipped required check
  # counts as passed): on a docs-only pull request whose shards skipped it passes, and otherwise it needs every shard to
  # have passed, joins their reports (tools/ci/m1-reports.sh) and runs the ratchet's unit test and its check, unchanged.
  # Gate M1 (M1.15) empties the list.
  e2e-m1:
    needs: [changes, e2e-m1-shard]
    if: ${{ github.event.pull_request.draft != true && (!cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: tools/ci/gate.sh "docs:e2e-m1-shard=$SHARDS"
        env:
          DOCS_ONLY: ${{ needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true') }}
          SHARDS: ${{ needs.e2e-m1-shard.result }}
      - uses: pnpm/action-setup@v6.1.0
        if: needs.e2e-m1-shard.result == 'success'
      - uses: actions/setup-node@v7.1.0
        if: needs.e2e-m1-shard.result == 'success'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.e2e-m1-shard.result == 'success'
      - run: pnpm nx run e2e:ratchet-test --outputStyle=static
        if: needs.e2e-m1-shard.result == 'success'
      - uses: actions/download-artifact@v8.0.2
        if: needs.e2e-m1-shard.result == 'success'
        with:
          pattern: m1-report-*
          path: tmp/m1-shards
      - name: The ratchet over every shard
        if: needs.e2e-m1-shard.result == 'success'
        run: |
          tools/ci/m1-reports.sh tmp/m1-shards 4 "$(find e2e/m1 -name '*.test.ts' | wc -l)" tmp
          node e2e/ratchet/check.ts tmp/m1-report.json e2e/m1/expected-failing tmp/m1-errors.json
          # The totals are printed, never committed (G9): the job's summary carries them.
          node e2e/totals/totals.mjs >> "$GITHUB_STEP_SUMMARY"

  # M2's checks run through the ratchet too (e2e/ratchet/README.md): the checks whose slice has not landed are on the per-check files of
  # e2e/m2/expected-failing/ and may fail; any other failure fails the job. One runner, one job: M2 has a handful of checks so far.
  # Skipped on a docs-only pull request, where a skip counts as passed (CI-docs-fast-path.md). Should `changes` itself fail, this runs.
  # Not a required check yet: branch protection is the lead's call (CI-branch-protection.md).
  e2e-m2:
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - run: NX_DAEMON=false pnpm nx run e2e:m2-ratchet --outputStyle=static

  # Goal 3's climbability check (`e2e/climb/README.md`): `ortho prove` on planted wrong handlers must name the journey and
  # step, show expected and got, point to the handler file and declaration, finish fast and give the same result twice.
  # All five properties hold since #119, so the job is required.
  # Skipped on a docs-only pull request (CI-speed.md), where a skip counts as passed. Should `changes` itself fail, this runs.
  e2e-climb:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm nx run e2e:climb --outputStyle=static

  # Goal 3's done check, begun (`e2e/stage1/README.md`): Plugged In's seven journeys green in `--env local` and `--env test`, through the
  # ratchet. Only for the goal's own branch: pull requests into goal/stage-1 and pushes to it. Skipped on a docs-only pull request, where a
  # skip counts as passed (CI-docs-fast-path.md). Should `changes` itself fail, this runs. No secret and no `id-token` permission: the test half
  # signs its verdicts with the local OIDC issuer of e2e/layer2/services.ts. About 1 minute on a Mac, so one runner and one job (CI-speed.md).
  e2e-stage1:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && ((github.event_name == 'pull_request' && github.base_ref == 'goal/stage-1') || github.ref == 'refs/heads/goal/stage-1') && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm nx run e2e:stage1 --outputStyle=static

  # Goal 6's done check, begun (`design/goals/06-portal.md`): the new portal's checks, starting with the theme's. Not a required
  # check yet, so a red run does not block; slice 2 puts the rest of the portal checks behind it. Skipped on a docs-only pull
  # request, where a skip counts as passed. Should `changes` itself fail, this runs.
  e2e-portal-next:
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium plus the system libraries it needs on this image, as `e2e-grid` has it (K19).
      - run: pnpm --filter @orthograph/e2e exec playwright install --with-deps chromium
      - run: pnpm nx run e2e:portal-next --outputStyle=static

  # Goal 3's grid runner (`e2e/grid/README.md`): its unit tests, then `ortho prove` and every switched-on cell, with the ratchet of
  # `design/decisions/G7-grid-ratchet.md`: a red pair not on `e2e/grid/expected-red.json` fails, and so does a listed pair that is green.
  e2e-grid:
    needs: [changes, portal-ui]
    # Not skipped when portal-ui is: a skipped job reads as passed where it is required, and this one cannot pass without the client. It runs, and fails at the artifact.
    # Skipped on a docs-only pull request (CI-speed.md): the grid reads generated docs under examples/, never a docs-only path.
    if: ${{ github.event.pull_request.draft != true && (!cancelled() && !(needs.changes.result == 'success' && (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.fast == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # K19: the portal's built client, from the portal-ui job (the only one with the licence).
      - uses: actions/download-artifact@v8.0.2
        with:
          name: portal-client
          path: packages/portal/dist/client
      - name: The portal's client must be here
        run: |
          if [ ! -f packages/portal/dist/client/index.html ]; then
            echo "::error::K19: the portal's client is missing. The portal-ui job builds it with the licence; this job reads the portal and cannot pass without it."
            exit 1
          fi
      # No Docker (K10 section 8): every service is a process. The runner image carries Docker, so take it off the PATH and
      # let a test that still reaches for it fail here.
      - name: No Docker on the PATH
        run: |
          sudo rm -f "$(command -v docker)"
          ! command -v docker
      # The Collector is its pinned binary (prove's telemetry module checks its digest before it runs): cached by version, and
      # fetched from the official release when the cache is empty.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/orthograph/otelcol-contrib
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      # K19: the portal is read in headless Chromium (e2e/served-portal). Playwright's own download plus the system libraries it needs on this image.
      - run: pnpm --filter @orthograph/e2e exec playwright install --with-deps chromium
      - run: pnpm nx run e2e:grid --outputStyle=static
