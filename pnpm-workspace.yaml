packages:
  - packages/*
  - examples/*
  - examples/superagent/plugins/*
  - e2e
  - docs/canon
allowBuilds:
  # HeroUI Pro's installer downloads the licensed build with a credential; a plain install gets the registry's empty shell and
  # runs nothing. The CI job that holds the secret runs the installer itself (`packages/portal-ui/tools/pro.mjs`, F7).
  "@heroui-pro/react": false
  # heroui-pro's keyring helper; its native build only serves a login on a person's own machine.
  "@zowe/secrets-for-zowe-sdk": false
  # Pi Durable's model-provider SDKs (it arrives with `@earendil-works/pi-env`, GOAL17-slice9-sandbox call 2). Their install scripts are
  # not needed: nothing here calls a provider from a script, and pi-env's daemon is a prebuilt binary in its package.
  "@google/genai": false
  protobufjs: false
  esbuild: true
  nx: true
  workerd: true
overrides:
  # Better Auth would resolve 0.29.9 (12 November 2026), under two weeks old; one copy keeps its types whole.
  kysely: 0.29.7
# AGENTS.md: versions published at least three days before they are added, transitive ones included (D2 #79; three
# days since 17 November 2026, R1). An override names the package below with its reason, and is logged in R1.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
