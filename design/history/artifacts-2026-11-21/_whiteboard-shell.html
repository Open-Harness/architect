<title>Whiteboard</title>
<!-- README
# Whiteboard appifact — shared type

This page is the Whiteboard RUNTIME only: index.html + artifact-type/app.js +
artifact-type/app.css (+ artifact-type/thumbnail/thumbnail.json, the gallery
thumbnail declaration) are one published release of the Whiteboard type,
shared by every board built on it. Nothing about any particular board is in
these files — not even its title.

## Where a board's data lives

In the board's own live store (the db capability), never in a file:
board/meta {v, title, order} (order = the z-order, element ids),
board/timer (the board's one shared countdown, the editor's),
board/inks (the ink colours people added to the pen's row, the editor's),
board/claim-<id> (where the chat's Claude says it is at work, while it is),
data/users/<a person's id>/idea (an idea that the chat's Claude offered that person alone), one
elements/<id> per element (the element's fields, no id — shapes, text,
containers, people's sticky notes, strokes, arrows, images, stickers, html embeds, links, tables; see
SKILL.md here for the caps and for the shapes of those Claude writes) and comments/<id>.
Images live in the artifact's asset store (_blob/<id>) or inline as small
data: URIs. Claude writes the documents at creation and revises them with
the ArtifactData tool; the editor writes them as people edit, and every page
merges changes live (last write wins per field; undo is per person). An
empty store is an empty board, which is what this type's own page shows;
where db is unavailable in a view the page opens an empty board read-only.
Everything read from the store is untrusted input, parsed by the same
boundary (parseBoard) on load.
-->
