{ id: "intro", group: "Start", t: "What Architect is", h: () => `
<h1>What Architect is</h1>
<p class="lede">Architect is Effect, one level up. You declare the whole system as typed code: its things, their state machines,
the events and errors, the steps, who may call each operation, how fast it must be and where it runs. That is the blueprint.</p>
<p>Everything else falls out of the blueprint: the server, the API, the SDK, the CLI, the docs, and later the MCP server and the portal.
Generated files are never edited by hand.</p>
<p>You, or an agent, fill in only the blanks: a handler for each operation, in a scaffold at <code>src/&lt;thing&gt;/&lt;operation&gt;.ts</code> that already fits.</p>
<p>Every operation is measured by nine evals, read from real telemetry: answer shape, declared errors, machine path, events, who may call,
steps, performance, coverage and explainability.</p>
<p>It's built in five layers, each closed by a gate, and everything runs for real on your Mac, in Cloudflare's own local runtime, with nothing mocked.</p>
<div class="loops">
  <div class="loop"><div class="loop-name">Design loop</div><div class="loop-stages"><span class="s-done">Ideate</span><span class="s-done">Spike</span><span class="s-done">Specify</span></div><div class="loop-out">The blueprint, blanks and scaffolds work today.</div></div>
  <div class="loop"><div class="loop-name">Build loop</div><div class="loop-stages"><span class="s-done">Build</span><span class="s-done">Test</span><span class="s-done">Deploy</span><span class="s-done">Watch</span></div><div class="loop-out">All four run across local environments.</div></div>
</div>
<p class="muted">The worked example is acme: the starter project (sign-up, organisations, members, invitations, API keys) plus the allowance, an owner letting a member spend up to a limit.</p>` },

{ id: "works", group: "Progress", t: "What works on your Mac", h: () => `
<h1>What works on your Mac</h1>
<p class="lede">Each line is checked against a captured run in the repo's evidence.</p>
<h2>Declare and call</h2>
<ul>
<li><code>architect prove --env local</code> proves acme's eleven journeys, with nine evals on each of fifteen operations, in about eight seconds.</li>
<li><code>architect check</code> fails whenever the code and the blueprint disagree.</li>
<li><code>architect add</code> and <code>generate</code> scaffold a new thing or operation, with its blanks marked.</li>
<li><code>architect brief</code> tells an agent exactly what to write, what not to touch, and which evals must pass.</li>
<li><code>architect impact</code> says which proofs a change made stale.</li>
<li>An agent wrote the allowance's spend handler from its brief alone, and it passed, for five cents.</li>
<li>A new project made from the preset passes check and prove.</li>
</ul>
<h2>Prove and ship</h2>
<ul>
<li><code>architect build</code> turns one revision into one bundle with one hash.</li>
<li><code>architect env up</code> runs test, staging and production side by side, each with its own state.</li>
<li><code>architect prove --env test</code> proves in a fresh world, signs a verdict per operation, and destroys the world.</li>
<li><code>architect worlds reap</code> removes worlds that outlived their lifetime.</li>
<li><code>architect version --next</code> works out the next version from what changed.</li>
<li><code>architect promote</code> moves the same bundle from test to staging to production, only on green verdicts.</li>
<li><code>architect publish --local</code> puts the SDK and CLI on a local npm registry, and the CLI in a Homebrew tap.</li>
<li><code>acme session sign-in</code> signs the generated CLI in with a device code.</li>
<li><code>architect telemetry view</code> and <code>prove --view</code> show each trace in a local viewer; Axiom is one line of config.</li>
<li>An MCP client signs in with OAuth and calls acme's operations as tools; a caller without the role is refused.</li>
<li><code>architect watch --env staging</code> prints p95 against budget and refusal counts, and a planted slow handler shows as drift.</li>
<li><code>/portal</code> on staging shows every operation per environment: proven, failed, stale with the reason, or unproven.</li>
</ul>` },

<li><b>One flaky check.</b> One run in three of the promotion check lost its connection to staging after a restart, and passed on retry.</li>

<p>The design docs: <a href="https://claude.ai/artifact/K7KtHJwu7YzZe43BeSPHo2">Architect design docs</a>. Every captured run: <a href="https://claude.ai/artifact/ChdX1m7bdTxTS1FGF2EZxB">the evidence page</a>.</p>` },
];
const PAGES = ALL_PAGES;

/* ---------- Docs ---------- */
const nav = document.getElementById("docnav");
{
  let group = "";
  nav.innerHTML = PAGES.map((pg) => {
    const head = pg.group !== group ? "<h4>" + pg.group + "</h4>" : "";
    group = pg.group;
    return head + '<a href="#' + pg.id + '" data-id="' + pg.id + '">' + pg.t + "</a>";
  }).join("");
}
let currentPage = null;
function renderDoc(id) {
  const page = PAGES.find((p) => p.id === id) || PAGES[0];
  document.getElementById("doc").innerHTML = page.h();
  document.querySelector("#doc h1").id = "page-title";
  document.title = page.t + " · Architect status";
  nav.querySelectorAll("a").forEach((a) => a.setAttribute("aria-current", a.dataset.id === page.id ? "page" : "false"));
  const moved = currentPage !== page.id;
  currentPage = page.id;
  return moved;
}

/* ---------- Navigation ---------- */
const doc = document.getElementById("doc");
const pagesToggle = document.getElementById("pages-toggle");
function setNavigation(open) {
  document.body.dataset.navigationOpen = String(open);
  pagesToggle.setAttribute("aria-expanded", String(open));
}
pagesToggle.addEventListener("click", () => setNavigation(pagesToggle.getAttribute("aria-expanded") !== "true"));
document.querySelector(".skip-link").addEventListener("click", (event) => {
  event.preventDefault();
  doc.focus({ preventScroll: true });
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && pagesToggle.getAttribute("aria-expanded") === "true") {
    setNavigation(false);
    pagesToggle.focus();
  }
});

/* ---------- Routing ---------- */
function route() {
  const navigating = currentPage !== null;
  const fromNavigation = nav.contains(document.activeElement);
  const moved = renderDoc(location.hash.slice(1) || "now");
  if (moved) doc.scrollTop = 0;
  setNavigation(false);
  if (navigating && fromNavigation) doc.focus({ preventScroll: true });
}
window.addEventListener("hashchange", route);
route();
</script>
